name = "valorant-shop-cron"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
preview_urls = false

[vars]
APP_URL = "https://xhv.sh/valorant-shop"

# Hourly bundle check, and the daily shop alerts at 00:00 UTC. The SCHEDULER_SECRET
# secret is set with `wrangler secret put` (see README.md in this folder).
[triggers]
crons = ["0 * * * *", "0 0 * * *"]

# Keep a log of every run (Workers & Pages -> valorant-shop-cron -> Logs). These match
# the settings shown in the Cloudflare dashboard, so a deploy does not change them.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
