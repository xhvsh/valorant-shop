<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Shared loadout - valorant shop</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="stylesheet" href="styles.css?v=280" />
  <link rel="stylesheet" href="loadshare.css?v=7" />
</head>
<body class="ls">
  <header class="ls-top">
    <a class="ls-brand" id="homeLink" href="./" title="Open valorant shop"><img src="logo.png" alt="" /><span>valorant shop</span></a>
    <span class="ls-divider" aria-hidden="true"></span>
    <h1>Shared loadout</h1>
    <div class="ls-top-right">
      <span class="ls-timer" id="timer" hidden></span>
      <a class="btn btn-ghost sm" id="homeBtn" href="./"><svg class="i" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg><span>Open valorant shop</span></a>
    </div>
  </header>
  <main class="ls-main" id="app">
    <p class="muted" id="status">Loading the loadout...</p>
  </main>
  <div class="ls-modal" id="modal" hidden></div>
  <div class="ls-bar" id="bar" hidden>
    <span class="ls-bar-msg" id="barMsg"></span>
    <button class="btn btn-ghost" id="resetBtn" type="button">Reset</button>
    <button class="btn" id="saveBtn" type="button" disabled>Save changes</button>
  </div>
  <footer class="footer">
    <p class="foot-note">Unofficial fan project. Not affiliated with Riot Games.</p>
    <div class="foot-links">
      <a href="legal">Disclaimer</a>
      <span>Bugs or questions? <b>@xhvsh</b> on Discord</span>
    </div>
  </footer>
  <script src="loadshare.js?v=8"></script>
</body>
</html>
